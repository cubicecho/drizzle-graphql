# Everything that has to hold before a change lands, in one place so the pull-request
# workflow and the release workflow cannot drift apart. Both call this.
name: Checks

on:
  workflow_call:
    inputs:
      graphql-scalars:
        description: >-
          Version range to install over the lockfile's, so the peer range can be checked
          against a major the lockfile does not pin. Empty means use the lockfile.
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # The suite starts MySQL 8 and PostgreSQL containers and waits on them, so it is
    # minutes rather than seconds. Well clear of that, but not open-ended.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # Not saved: the lockfile stays the source of truth for everything else, and only
      # this one package is swapped for the run.
      - name: Install graphql-scalars ${{ inputs.graphql-scalars }}
        if: inputs.graphql-scalars != ''
        run: npm install --no-save graphql-scalars@"${{ inputs.graphql-scalars }}"

      - name: Lint
        run: npx biome check .

      - name: Type check (src)
        run: npx tsc --noEmit

      # Type-checks tests/ too, which is what makes the `expectTypeOf` assertions
      # in the dialect suites actually fail the build when the public types drift.
      - name: Type check (tests)
        run: npx tsc --noEmit -p tests/tsconfig.json

      # The whole suite, MySQL and PostgreSQL included. Those four files bring their own
      # containers up through dockerode, so the runner's Docker daemon is all they need —
      # no service block, no compose file.
      - name: Test
        run: npx vitest run
