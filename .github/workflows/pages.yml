# The canonical Pages deploy for a cubicecho project site.
#
# Copied to .github/workflows/pages.yml by cubesite's scaffold. It assumes the
# site lives in ./site and builds to ./site/_site — the layout every project
# here uses, so the file is the same in every repo and a fix travels.
#
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let an in-flight one finish: a cancelled Pages
# deploy can leave the site on the previous artifact with no sign of why.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - run: npm run build

      # The site is the only public face of some of these repos, so a deploy
      # that publishes an empty directory should fail here, not silently.
      - name: The build produced a site
        run: test -s _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
